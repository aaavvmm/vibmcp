[project]
name = "vibmcp"
version = "0.2.0"
description = "工业振动信号诊断 MCP Server —— 让任意 LLM Agent 具备轴承故障诊断能力"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "numpy",
    "scipy",
    "matplotlib",
]

[project.scripts]
vibmcp = "vibmcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
per-file-ignores = {"demo/**" = ["E402"]}

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "src/vibmcp/server.py",
    "src/vibmcp/plotting.py",
    "src/vibmcp/report.py",
]
